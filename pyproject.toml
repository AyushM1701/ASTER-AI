[project]
name = "medical-ai-research"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Local, source-backed medical education and research workspace"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["local: requires a locally installed asset or executable"]

[tool.ruff]
line-length = 100
extend-exclude = ["artifacts", "data", ".impeccable"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
