name: Windows release candidate (v2)
# Builds the reference library, frozen app, component archives, signed release
# lock, AsterSetup-Windows-x64.exe and the bootstrap pin; runs packaged
# acceptance against a local mirror; then creates a DRAFT prerelease.
# Publication, code signing and clean-VM acceptance remain manual gates.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (must match packaging/release-profile.v2.json)'
        required: true
      library_version:
        description: 'Library pack version to build (e.g. 2026.10.14)'
        required: true
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  trusted-ref:
    runs-on: windows-2022
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.repository }}' -ne 'AyushM1701/ASTER-AI') { throw 'Unexpected release repository' }
          $branch = gh api repos/AyushM1701/ASTER-AI/branches/main | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $branch.protected) { throw 'Main must be protected before a release build' }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release ref must belong to main' }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

  build:
    needs: trusted-ref
    # Isolated, maintained runner with an NVIDIA GPU (DirectML indexing), Ollama models
    # qwen3-vl:2b-instruct and qwen3:4b-q4_K_M pulled, Tesseract, and the library HTTP cache.
    # Never run untrusted pull requests on this runner.
    runs-on: [self-hosted, Windows, X64, aster-release]
    environment: aster-release-build
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.trusted-ref.outputs.commit }}
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.Substring(1) } else { '${{ inputs.version }}' }
          $library = if ('${{ inputs.library_version }}') { '${{ inputs.library_version }}' } else { (Get-Date -Format 'yyyy.MM.dd') }
          if ($version -notmatch '^[0-9][A-Za-z0-9_.-]{0,60}$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "library=$library" >> $env:GITHUB_OUTPUT
      - name: Prepare signing key (protected secret, never written to the workspace)
        shell: pwsh
        env:
          KEY: ${{ secrets.ASTER_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:KEY) { throw 'ASTER_SIGNING_KEY_PEM secret is not configured' }
          $path = Join-Path $env:RUNNER_TEMP 'aster-signing.pem'
          Set-Content -LiteralPath $path -Value $env:KEY -NoNewline -Encoding ascii
          "ASTER_SIGNING_KEY=$path" >> $env:GITHUB_ENV
      - name: Source tests
        shell: pwsh
        run: |
          & $env:ASTER_BUILD_PYTHON -m pip check
          & $env:ASTER_BUILD_PYTHON -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Acquire, pack, index and report the reference library
        shell: pwsh
        env:
          LIBRARY_VERSION: ${{ steps.version.outputs.library }}
        run: |
          & $env:ASTER_BUILD_PYTHON -m aster_library.build acquire --provider all --refresh
          & $env:ASTER_BUILD_PYTHON -m aster_library.build acquire --provider europepmc-gapfill
          & $env:ASTER_BUILD_PYTHON -m aster_library.build pack --version $env:LIBRARY_VERSION
          foreach ($edition in 'core','nc') { & $env:ASTER_INDEX_PYTHON -m aster_library.build index --pack "data/library/packs/aster-library-$edition-$env:LIBRARY_VERSION" }
          & $env:ASTER_BUILD_PYTHON -m aster_library.build report --pack "data/library/packs/aster-library-core-$env:LIBRARY_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Library build failed' }
      - name: Build release candidate
        shell: pwsh
        run: |
          & $env:ASTER_BUILD_PYTHON packaging/build_release.py --version ${{ steps.version.outputs.version }} --library-version ${{ steps.version.outputs.library }}
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Packaged acceptance from a local mirror (install, self-test, Q&A, documents, X-ray, offline, repair, uninstall)
        shell: pwsh
        run: |
          & $env:ASTER_BUILD_PYTHON -m aster_release.acceptance_v2 --assets "artifacts/release-v2/${{ steps.version.outputs.version }}/assets" --report "artifacts/release-v2/${{ steps.version.outputs.version }}/acceptance.json"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged acceptance failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-release-candidate
          path: |
            artifacts/release-v2/${{ steps.version.outputs.version }}/assets/*
            artifacts/release-v2/${{ steps.version.outputs.version }}/acceptance.json
            data/library/packs/build-${{ steps.version.outputs.library }}/COVERAGE_REPORT.md

  publish-draft:
    needs: build
    runs-on: windows-2022
    environment: aster-release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aster-release-candidate
          path: release-assets
      - name: Create draft prerelease (owner publishes after clean-VM acceptance)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -Recurse -File | Where-Object { $_.Name -ne 'acceptance.json' } | ForEach-Object FullName
          $tag = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { 'v${{ inputs.version }}' }
          gh release create $tag @assets --repo AyushM1701/ASTER-AI --draft --prerelease --title "Aster $tag (release candidate)" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed' }
