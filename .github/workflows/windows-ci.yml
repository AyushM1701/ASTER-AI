name: Windows source and release tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned source-test dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Source regressions (local-asset tests excluded)
        run: python -m pytest -q -m "not local"
      - name: Parse web JavaScript
        run: node --check frontend/web/app.js
      - name: Whole-source lint (generated data and vendor artifacts excluded)
        run: python -m ruff check .
