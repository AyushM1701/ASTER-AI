name: Signing key check
# Confirms that the ASTER_SIGNING_KEY_PEM secret in the aster-release-build
# environment is the private half of configs/release/signing-public-key.pem,
# which signed the pinned release lock. Nothing is built, signed or published.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    environment: aster-release-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned cryptography
        run: python -m pip install cryptography==50.0.2
      - name: Check the secret against the committed public key
        shell: pwsh
        env:
          KEY: ${{ secrets.ASTER_SIGNING_KEY_PEM }}
        run: |
          if (-not $env:KEY) { throw 'ASTER_SIGNING_KEY_PEM secret is not configured' }
          $path = Join-Path $env:RUNNER_TEMP 'aster-signing.pem'
          Set-Content -LiteralPath $path -Value $env:KEY -NoNewline -Encoding ascii
          try {
            python scripts/check_signing_key.py $path
            if ($LASTEXITCODE -ne 0) { throw 'Signing key check failed' }
          } finally {
            Remove-Item -LiteralPath $path -Force
          }
